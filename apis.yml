name: AppIQ
description: 'AppIQ was a storage-infrastructure software company (founded 2001, Burlington, MA) making
  storage resource management and SAN management software for visualization, provisioning, monitoring,
  reporting, and policy-based automation, backed by Matrix Partners, North Bridge Venture Partners, ATV,
  and Intel Capital. It was acquired by Hewlett-Packard in October 2005 and absorbed into HP/HPE. It has
  no independent, live developer surface today: appiq.com now redirects to hpe.com and there is no public
  API, developer portal, documentation, or OpenAPI to enrich. Surfaced here as a Matrix Partners
  portfolio lead; enrichment found no active API artifacts.'
